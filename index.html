<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celebração dos Casamentos - 2025</title>

  <!-- Fonte e Estilo -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Título -->
  <h1>Celebração dos Casamentos - 2025</h1>

  <!-- Galeria e botão de download geral -->
  <main>
    <div class="gallery" id="gallery"></div>
    <div class="download-all">
      <button onclick="baixarTudo()">📦 Baixar Todas</button>
    </div>
  </main>

  <!-- Modal para ampliar a imagem -->
  <div id="modal" class="modal">
    <span class="close" onclick="fecharModal()">&times;</span>
    <img class="modal-content" id="imgModal" alt="Imagem ampliada">
  </div>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
